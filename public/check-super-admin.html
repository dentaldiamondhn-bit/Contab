<!DOCTYPE html>
<html>
<head>
    <title>Verificar Super Admin</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; background: #9C27B0; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        button:hover { background: #7B1FA2; }
        #result { margin-top: 20px; padding: 10px; background: #f5f5f5; border-radius: 5px; }
        pre { background: #333; color: #fff; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .warning { background: #fff3cd; color: #856404; padding: 15px; border-radius: 5px; margin: 10px 0; border: 1px solid #ffeaa7; }
        .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin: 10px 0; border: 1px solid #c3e6cb; }
        table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>🔍 Verificar Super Admin</h1>
    
    <div class="warning">
        <h3>👑 ¿Por qué verificar el super admin?</h3>
        <p>El super admin puede estar:</p>
        <ul>
            <li>🔒 Protegido contra eliminación</li>
            <li>📂 En una tabla diferente</li>
            <li>🔄 Recreando datos automáticamente</li>
            <li>🍪 Guardado en cookies/sesión</li>
        </ul>
    </div>
    
    <button onclick="checkSuperAdmin()">🔍 VERIFICAR SUPER ADMIN</button>
    
    <div id="result"></div>

    <script>
        async function checkSuperAdmin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '🔍 Buscando super admin...';
            
            try {
                const response = await fetch('/api/admin/check-super-admin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    let html = `
                        <div class="success">
                            <h2>✅ ${result.message}</h2>
                            <p>Total usuarios encontrados: ${result.summary.totalUsers}</p>
                        </div>
                    `;
                    
                    // Mostrar usuarios de la tabla User
                    if (result.summary.userTable && result.summary.userTable.length > 0) {
                        html += `
                            <h3>👥 Usuarios en tabla 'User':</h3>
                            <table>
                                <tr>
                                    <th>Email</th>
                                    <th>Rol</th>
                                    <th>Tenant ID</th>
                                </tr>
                        `;
                        
                        result.summary.userTable.forEach(user => {
                            html += `
                                <tr>
                                    <td>${user.email || 'N/A'}</td>
                                    <td>${user.role || 'N/A'}</td>
                                    <td><code>${user.tenantid || 'N/A'}</code></td>
                                </tr>
                            `;
                        });
                        
                        html += '</table>';
                    }
                    
                    // Mostrar usuarios de la tabla users
                    if (result.summary.usersTable && result.summary.usersTable.length > 0) {
                        html += `
                            <h3>👥 Usuarios en tabla 'users':</h3>
                            <table>
                                <tr>
                                    <th>Email</th>
                                    <th>Rol</th>
                                    <th>Tenant ID</th>
                                </tr>
                        `;
                        
                        result.summary.usersTable.forEach(user => {
                            html += `
                                <tr>
                                    <td>${user.email || 'N/A'}</td>
                                    <td>${user.role || 'N/A'}</td>
                                    <td><code>${user.tenantid || 'N/A'}</code></td>
                                </tr>
                            `;
                        });
                        
                        html += '</table>';
                    }
                    
                    // Mostrar resultados detallados
                    if (result.results && result.results.length > 0) {
                        html += `
                            <h3>🔍 Resultados detallados:</h3>
                            <pre>${JSON.stringify(result.results, null, 2)}</pre>
                        `;
                    }
                    
                    // Si hay usuarios, mostrar botón para eliminar
                    if (result.summary.totalUsers > 0) {
                        html += `
                            <div class="warning">
                                <h3>⚠️ Se encontraron usuarios restantes</h3>
                                <p>Esto puede explicar por qué sigues viendo "Angel Ring".</p>
                                <button onclick="window.location.href='/clean-slate.html'" style="background: #f44336;">
                                    🗑️ EJECUTAR LIMPIEZA COMPLETA NUEVAMENTE
                                </button>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="success">
                                <h3>✅ No hay usuarios restantes</h3>
                                <p>El problema debe estar en el cache del navegador.</p>
                                <button onclick="window.location.href='/clear-cache.html'" style="background: #ff9800;">
                                    🧹 LIMPIAR CACHE DEL NAVEGADOR
                                </button>
                            </div>
                        `;
                    }
                    
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `
                        <div class="warning">
                            <h2>❌ Error</h2>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="warning">
                        <h2>❌ Error de conexión</h2>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
