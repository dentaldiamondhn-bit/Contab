<!DOCTYPE html>
<html>
<head>
    <title>Verificar Tenant Actual</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        button:hover { background: #45a049; }
        #result { margin-top: 20px; padding: 10px; background: #f5f5f5; border-radius: 5px; }
        pre { background: #333; color: #fff; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .info { background: #d1ecf1; color: #0c5460; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .warning { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin: 10px 0; }
        table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>🔍 Verificar Tenant Actual</h1>
    
    <div class="info">
        ℹ️ Esta herramienta muestra todos los tenants y usuarios actuales para diagnosticar el estado del sistema.
    </div>
    
    <button onclick="checkTenant()">🔍 Verificar Tenants y Usuarios</button>
    
    <div id="result"></div>

    <script>
        async function checkTenant() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '🔄 Analizando...';
            
            try {
                const response = await fetch('/api/admin/check-tenant', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    let html = `
                        <div class="success">
                            <h2>✅ ${result.message}</h2>
                            <p>Tenants totales: ${result.totalTenants || 0}</p>
                            <p>Usuarios totales: ${result.totalUsers || 0}</p>
                        </div>
                    `;
                    
                    if (result.tenants && result.tenants.length > 0) {
                        html += `
                            <h3>📋 Tenants Encontrados:</h3>
                            <table>
                                <tr>
                                    <th>ID</th>
                                    <th>Business Name</th>
                                    <th>Tenant Code</th>
                                    <th>Active</th>
                                    <th>Created</th>
                                </tr>
                        `;
                        
                        result.tenants.forEach(tenant => {
                            const name = tenant.business_name || tenant.businessName || 'SIN NOMBRE';
                            const code = tenant.tenant_code || tenant.tenantCode || 'N/A';
                            const active = tenant.is_active !== undefined ? tenant.is_active : (tenant.isActive !== undefined ? tenant.isActive : 'N/A');
                            const created = tenant.created_at || tenant.createdAt || 'N/A';
                            
                            html += `
                                <tr>
                                    <td><code>${tenant.id}</code></td>
                                    <td><strong>${name}</strong></td>
                                    <td>${code}</td>
                                    <td>${active ? '✅' : '❌'}</td>
                                    <td>${new Date(created).toLocaleString()}</td>
                                </tr>
                            `;
                        });
                        
                        html += '</table>';
                    }
                    
                    if (result.users && result.users.length > 0) {
                        html += `
                            <h3>👥 Usuarios Encontrados:</h3>
                            <table>
                                <tr>
                                    <th>Email</th>
                                    <th>Tenant ID</th>
                                    <th>Tenant Name</th>
                                    <th>Nombre</th>
                                </tr>
                        `;
                        
                        result.users.forEach(user => {
                            html += `
                                <tr>
                                    <td>${user.email}</td>
                                    <td><code>${user.tenantid}</code></td>
                                    <td><strong>${user.tenantName}</strong></td>
                                    <td>${user.firstname} ${user.lastname}</td>
                                </tr>
                            `;
                        });
                        
                        html += '</table>';
                    }
                    
                    html += `<h3>📊 Datos Completos:</h3>
                        <pre>${JSON.stringify(result, null, 2)}</pre>`;
                    
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `
                        <div class="warning">
                            <h2>❌ Error</h2>
                            <pre>${JSON.stringify(result, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="warning">
                        <h2>❌ Error de conexión</h2>
                        <pre>${error.message}</pre>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
