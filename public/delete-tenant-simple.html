<!DOCTYPE html>
<html>
<head>
    <title>Eliminar Tenant Angel Ring</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; background: #ff4444; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #cc0000; }
        #result { margin-top: 20px; padding: 10px; background: #f5f5f5; border-radius: 5px; }
        pre { background: #333; color: #fff; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🗑️ Eliminar Tenant "Angel Ring"</h1>
    <p>⚠️ Esta acción eliminará permanentemente el tenant "Angel Ring" y todos sus datos asociados.</p>
    <button onclick="deleteTenant()">Eliminar Tenant</button>
    <div id="result"></div>

    <script>
        async function deleteTenant() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '🔄 Procesando...';
            
            try {
                const response = await fetch('/api/admin/delete-tenant', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        tenantId: 'cmofey73w000087izrdfvtlve'
                    })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <h2>✅ Éxito</h2>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h2>❌ Error</h2>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2>❌ Error de conexión</h2>
                    <pre>${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
