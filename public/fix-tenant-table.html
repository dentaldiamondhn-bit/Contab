<!DOCTYPE html>
<html>
<head>
    <title>Arreglar Tablas de Tenants</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        button:hover { background: #f57c00; }
        .danger { background: #f44336; }
        .danger:hover { background: #d32f2f; }
        #result { margin-top: 20px; padding: 10px; background: #f5f5f5; border-radius: 5px; }
        pre { background: #333; color: #fff; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .warning { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🔧 Arreglar Tablas de Tenants</h1>
    
    <div class="warning">
        ⚠️ Esta herramienta unificará las tablas 'Tenant' y 'tenants' para eliminar duplicidad.
    </div>
    
    <button onclick="fixTenantTables()">🔧 Unificar Tablas de Tenants</button>
    
    <div id="result"></div>

    <script>
        async function fixTenantTables() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '🔄 Procesando...';
            
            try {
                const response = await fetch('/api/admin/fix-tenant-table', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <h2>✅ Éxito</h2>
                        <p><strong>${result.message}</strong></p>
                        <p>Tenants encontrados: ${result.finalCount}</p>
                        <h3>Resultados:</h3>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                        <h3>Tenants en la base de datos:</h3>
                        <pre>${JSON.stringify(result.tenants, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h2>❌ Error</h2>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2>❌ Error de conexión</h2>
                    <pre>${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
