<!DOCTYPE html>
<html>
<head>
    <title>Arreglo Simple de Tenants</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        button:hover { background: #1976D2; }
        .danger { background: #f44336; }
        .danger:hover { background: #d32f2f; }
        #result { margin-top: 20px; padding: 10px; background: #f5f5f5; border-radius: 5px; }
        pre { background: #333; color: #fff; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .warning { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .info { background: #d1ecf1; color: #0c5460; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🔧 Arreglo Simple de Tenants</h1>
    
    <div class="info">
        ℹ️ Esta herramienta detecta automáticamente cuál tabla funciona y elimina el tenant "Angel Ring".
    </div>
    
    <div class="warning">
        ⚠️ Esta acción eliminará permanentemente el tenant "Angel Ring" y todos sus datos asociados.
    </div>
    
    <button onclick="fixTenantTables()">🗑️ Eliminar Tenant "Angel Ring"</button>
    
    <div id="result"></div>

    <script>
        async function fixTenantTables() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '🔄 Procesando...';
            
            try {
                const response = await fetch('/api/admin/simple-tenant-fix', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    let html = `
                        <h2>✅ Operación Completada</h2>
                        <p><strong>${result.message}</strong></p>
                        <p>Tabla utilizada: <code>${result.workingTable}</code></p>
                    `;
                    
                    if (result.deletedTenant) {
                        html += `
                            <h3>Tenant Eliminado:</h3>
                            <pre>${JSON.stringify(result.deletedTenant, null, 2)}</pre>
                            <p>Tenants restantes: ${result.remainingCount}</p>
                        `;
                    }
                    
                    if (result.tenantNames) {
                        html += `
                            <h3>Tenants Encontrados:</h3>
                            <ul>${result.tenantNames.map(name => `<li>${name}</li>`).join('')}</ul>
                        `;
                    }
                    
                    html += `<h3>Detalles Completos:</h3>
                        <pre>${JSON.stringify(result, null, 2)}</pre>`;
                    
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = `
                        <h2>❌ Error</h2>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2>❌ Error de conexión</h2>
                    <pre>${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
